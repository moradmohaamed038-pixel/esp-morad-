name: morad_tk
description: تطبيق التحكم بالأجهزة الذكية عن بعد

publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ============================================================================
  # Firebase
  # ============================================================================
  firebase_core: ^2.24.0
  firebase_database: ^10.2.0
  firebase_auth: ^4.14.0

  # ============================================================================
  # State Management
  # ============================================================================
  provider: ^6.1.0

  # ============================================================================
  # Networking & Communication
  # ============================================================================
  web_socket_channel: ^2.4.0
  multicast_dns: ^0.3.0

  # ============================================================================
  # UI & Design
  # ============================================================================
  flutter_localizations:
    sdk: flutter

  # ============================================================================
  # Utilities
  # ============================================================================
  uuid: ^4.0.0
  intl: ^0.20.0

  # ============================================================================
  # Local Storage
  # ============================================================================
  shared_preferences: ^2.2.0

  # ============================================================================
  # Notifications
  # ============================================================================
  flutter_local_notifications: ^14.1.0

  # ============================================================================
  # Analytics & Charts
  # ============================================================================
  fl_chart: ^0.64.0

  # ============================================================================
  # File & Image Handling
  # ============================================================================
  image_picker: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # ============================================================================
  # Localization
  # ============================================================================
  generate: true

  # ============================================================================
  # Assets (Images, Icons, etc)
  # ============================================================================
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: CustomFont
      fonts:
        - asset: assets/fonts/CustomFont-Regular.ttf